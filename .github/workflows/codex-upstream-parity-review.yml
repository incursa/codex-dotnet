name: Codex Upstream Parity Review

on:
  schedule:
    - cron: "19 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review-upstream:
    runs-on: ubuntu-latest
    concurrency:
      group: codex-upstream-parity-review
      cancel-in-progress: true
    steps:
      - name: Checkout Codex .NET repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKBENCH_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout upstream Codex repo
        uses: actions/checkout@v6
        with:
          repository: openai/codex
          path: .upstream/openai-codex
          fetch-depth: 0
          persist-credentials: false

      - name: Review upstream parity
        id: review
        shell: pwsh
        run: ./scripts/Invoke-UpstreamParityReview.ps1 -UpstreamRepoPath "$env:GITHUB_WORKSPACE/.upstream/openai-codex" -WriteReport

      - name: Commit parity handoff directly to main
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- quality/upstream-parity-gaps.md)" ]]; then
            echo "No parity report changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- quality/upstream-parity-gaps.md
          git commit -m "chore: refresh upstream parity handoff"
          git push origin HEAD:main
